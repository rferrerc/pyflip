[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflip"
version = "0.0.1"

dependencies = [
  "astropy",
  "imageio",
  "matplotlib",
  "numpy",
  "pyklip>=2.8",
  "scipy",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "tqdm",
  "stpsf>=2.2.0",
  "stsynphot>=1.5.1",
  "synphot>=1.7.0"
]
readme = "README.md"
license = "BSD-3-Clause"

[tool.setuptools]
packages = ["pyflip"]
